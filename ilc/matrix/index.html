<meta charset="UTF-8">

<title>COMMA CARE – Approval Matrix</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden;font-family:Arial,sans-serif}
#viewport{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#page{position:relative;width:min(100vw,150vh);height:min(100vh,66.6667vw);background:#fff;overflow:hidden}
#page>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.hotspot{position:absolute;z-index:5;background:transparent;border:0;cursor:text}
.hotspot:hover{outline:1px dashed rgba(20,60,110,.28)}
.overlay{position:absolute;z-index:6;background:rgba(255,255,255,.97);display:flex;align-items:center;justify-content:center;text-align:center;
padding:1%;white-space:pre-wrap;word-break:break-word;overflow:hidden;color:#082f60;
font-size:clamp(5px,.62vw,10px);line-height:1.08}
.overlay.small{font-size:clamp(5px,.52vw,8.5px)}
.overlay.workflow{align-items:flex-start;padding-top:8%;font-size:clamp(6px,.60vw,10px)}
.overlay.notes{justify-content:flex-start;align-items:flex-start;text-align:left;font-size:clamp(6px,.58vw,9.5px)}
#modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
#box{width:min(620px,92vw);background:#fff;border-radius:12px;padding:18px;box-shadow:0 20px 70px #0008}
h3{margin:0 0 8px;color:#092f5d} p{margin:0 0 10px;color:#555;font-size:12px}
textarea{width:100%;height:150px;resize:vertical;padding:10px;border:1px solid #b9c4cf;border-radius:8px;font:14px Arial}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
button{border:0;border-radius:7px;padding:9px 14px;font-weight:bold;cursor:pointer}
#save{background:#092f5d;color:#fff} #cancel{background:#e8edf2;color:#18344e} #reset{background:#fff0f0;color:#a00}
#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#092f5ddd;color:#fff;padding:7px 12px;border-radius:20px;font-size:11px;z-index:90}
</style>
</head>

</div>

 "x": 1410, "y": 944, "w": 115, "h": 24, "cls": "small"}, {"id": "ceo-approval", "label": "CEO / Management Approval", "x": 1210, "y": 974, "w": 205, "h": 24, "cls": "small"}, {"id": "ceo-date", "label": "CEO Approval Date", "x": 1410, "y": 974, "w": 115, "h": 24, "cls": "small"}];
const KEY="comma-care-approval-matrix-edits";
const page=document.getElementById("page");
const modal=document.getElementById("modal");
const text=document.getElementById("text");
const title=document.getElementById("title");
let edits=JSON.parse(localStorage.getItem(KEY)||"{}");
let current=null;

function pos(el,h){
  el.style.left=(h.x/1536*100)+"%";
  el.style.top=(h.y/1024*100)+"%";
  el.style.width=(h.w/1536*100)+"%";
  el.style.height=(h.h/1024*100)+"%";
}

function render(){
  page.querySelectorAll(".hotspot").forEach(e=>e.remove());
  HOTSPOTS.forEach(h=>{
    const base=document.createElement("div");
    base.className="hotspot";
    pos(base,h);
    base.title=h.label;
    base.onclick=(e)=>{e.stopPropagation(); fullscreen(); openEditor(h)};
    page.appendChild(base);

    if(Object.prototype.hasOwnProperty.call(edits,h.id)){
      const ov=document.createElement("div");
      ov.className="overlay "+h.cls;
      ov.textContent=edits[h.id];
      pos(ov,h);
      ov.onclick=(e)=>{e.stopPropagation(); fullscreen(); openEditor(h)};
      page.appendChild(ov);
    }
  });
}

function fullscreen(){
  if(!document.fullscreenElement && document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(()=>{});
}

function openEditor(h){
  current=h;
  title.textContent=h.label;
  text.value=edits[h.id] ?? "";
  modal.style.display="flex";
  setTimeout(()=>{text.focus();text.select()},30);
}

function closeEditor(){modal.style.display="none";current=null}

function persist(){
  localStorage.setItem(KEY,JSON.stringify(edits));
  render();
}

document.getElementById("save").onclick=()=>{
  if(!current)return;
  edits[current.id]=text.value;
  persist();closeEditor();
};
document.getElementById("reset").onclick=()=>{
  if(!current)return;
  delete edits[current.id];
  persist();closeEditor();
};
document.getElementById("cancel").onclick=closeEditor;
modal.onclick=e=>{if(e.target===modal)closeEditor()};
text.onkeydown=e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter")document.getElementById("save").click();
  if(e.key==="Escape")closeEditor();
};
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && modal.style.display!=="flex" && document.fullscreenElement)
    document.exitFullscreen().catch(()=>{});
});
document.getElementById("viewport").onclick=fullscreen;
render();
</script>
